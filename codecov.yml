coverage:
  precision: 2
  round: down
  range: "70...95"
  status:
    project:
      default:
        target: 70%
        threshold: 1%
        if_no_uploads: error
    patch:
      default:
        target: 80%
        threshold: 1%
        if_no_uploads: error

ignore:
  - "main.py"
  - "tests/"
  - "benchmarks/"
  - "error_analysis/"
  - "scripts/"
  - "monitor_performance.py"
  - "upload_documents.py"
  - "**/__pycache__/"
  - "**/*.pyc"
  - "**/.*"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false