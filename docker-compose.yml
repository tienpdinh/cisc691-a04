services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fake-gcs:
    image: fsouza/fake-gcs-server
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-host", "0.0.0.0", "-port", "4443"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4443/storage/v1/b"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rag-api:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./config.local.json:/app/config.json:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - STORAGE_EMULATOR_HOST=http://fake-gcs:4443
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chromadb_data:
  ollama_data: