# Job for document ingestion
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-ingest-job
  namespace: rag-pipeline
  labels:
    app: rag-pipeline
    job-type: ingest
spec:
  template:
    metadata:
      labels:
        app: rag-pipeline
        job-type: ingest
    spec:
      containers:
      - name: rag-pipeline
        image: gcr.io/cisc691-a04/rag-pipeline:latest
        command: ["python", "main.py", "step01_ingest", "--input_filename", "all"]
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /app/config.json
          subPath: config.json
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: rag-pipeline-config
      - name: data
        persistentVolumeClaim:
          claimName: rag-pipeline-data
      - name: logs
        persistentVolumeClaim:
          claimName: rag-pipeline-logs
      restartPolicy: Never
  backoffLimit: 3
---
