apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: rag-pipeline-base

resources:
  - namespace.yaml
  - configmap.yaml
  - persistent-volumes.yaml
  - ollama-deployment.yaml
  - rag-pipeline-deployment.yaml
  - service-account.yaml

# Common labels applied to all resources
commonLabels:
  app: rag-pipeline
  version: v1.0.0

# Image tag that can be overridden
images:
  - name: gcr.io/cisc691-a04/rag-pipeline
    newTag: latest