apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-pipeline-data
  namespace: rag-pipeline
  labels:
    app: rag-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard-rwo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-pipeline-vectordb
  namespace: rag-pipeline
  labels:
    app: rag-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard-rwo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-pipeline-logs
