apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-pipeline-sa
  namespace: rag-pipeline
  labels:
    app: rag-pipeline
  annotations:
    iam.gke.io/gcp-service-account: rag-pipeline@cisc691-a04.iam.gserviceaccount.com
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-service-account-key
  namespace: rag-pipeline
  labels:
    app: rag-pipeline
type: Opaque
# Note: Add the service account key using kubectl create secret:
# kubectl create secret generic gcp-service-account-key \
#   --from-file=key.json=path/to/service-account-key.json \
#   -n rag-pipeline