[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src --cov-report=html --cov-report=term-missing --cov-report=xml
norecursedirs = benchmarks

[coverage:run]
omit = 
    main.py
    benchmarks/*
    tests/*
    error_analysis/*
    scripts/*
    monitor_performance.py
    upload_documents.py
    */__pycache__/*
    */.*